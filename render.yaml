services:
  - type: web
    name: ai-dressing-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_MODE
        value: live
      - key: AI_STYLING_MODE
        value: live
      - key: AI_IMAGE_MODE
        value: live
      - key: QWEN_VISION_MODEL
        value: qwen3.7-plus
      - key: QWEN_IMAGE_MODEL
        value: qwen-image-3.0-pro
      - key: QWEN_IMAGE_SIZE
        value: 928*1664
      - key: QWEN_IMAGE_PLAN_LIMIT
        value: "1"
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: MODEL_TIMEOUT_SECONDS
        value: "120"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
